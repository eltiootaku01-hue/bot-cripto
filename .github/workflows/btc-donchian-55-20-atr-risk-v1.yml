name: BTC Donchian 55/20 ATR14 frozen replay
on:
  push:
    branches:
      - research/btc-donchian-55-20-atr-risk-v1
    paths:
      - research/donchian_btc_55_20_atr_risk_v1.py
      - research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - tests/test_donchian_btc_55_20_atr_risk_v1.py
      - .github/workflows/btc-donchian-55-20-atr-risk-v1.yml
      - docs/research/BTC_DONCHIAN_55_20_ATR14_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-donchian-55-20-atr-risk-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: Donchian channel tests and full-regime replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile strategy and test
        run: python -m py_compile research/donchian_btc_55_20_atr_risk_v1.py research/replay_btc_momentum_90d_atr_full_2020_2026.py tests/test_donchian_btc_55_20_atr_risk_v1.py
      - name: Run deterministic channel tests
        run: python -m pytest -q tests/test_donchian_btc_55_20_atr_risk_v1.py
      - name: Acquire public data and run frozen accounting replay
        run: python research/donchian_btc_55_20_atr_risk_v1.py --output-dir donchian-55-20-output
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-donchian-55-20-atr-risk-v1
          path: donchian-55-20-output/
          if-no-files-found: warn
          retention-days: 90
