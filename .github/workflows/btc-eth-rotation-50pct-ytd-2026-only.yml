name: BTC ETH 4h rotation 50 percent — YTD-only validation

on:
  push:
    branches:
      - research/btc-eth-rotation-50pct-ytd-2026-only
    paths:
      - research/replay_btc_eth_rotation_50pct_ytd_2026_only.py
      - .github/workflows/btc-eth-rotation-50pct-ytd-2026-only.yml

permissions:
  contents: read

concurrency:
  group: btc-eth-rotation-50pct-ytd-2026-only
  cancel-in-progress: false

jobs:
  frozen-ytd-rotation:
    name: Replay frozen YTD BTC ETH 4h rotation at 50 percent allocation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile and run frozen YTD replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rotation-50pct-ytd-output
          python -m py_compile research/replay_btc_eth_rotation_50pct_ytd_2026_only.py
          python research/replay_btc_eth_rotation_50pct_ytd_2026_only.py 2>&1 | tee rotation-50pct-ytd-output/console.txt
          python -m pytest -q tests/test_virtual_backtest.py
      - name: Upload hash-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btc-eth-rotation-50pct-ytd-2026-only
          path: rotation-50pct-ytd-output/
          if-no-files-found: warn
          retention-days: 90
