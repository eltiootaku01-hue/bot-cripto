name: BTC ETH 4h Bollinger RSI14 mean reversion — deterministic replay
on:
  push:
    branches:
      - research/btc-eth-bollinger-rsi14-mean-reversion
    paths:
      - research/replay_btc_eth_bollinger_rsi14_mean_reversion.py
      - tests/test_btc_eth_bollinger_rsi14_mean_reversion.py
      - .github/workflows/btc-eth-bollinger-rsi14-mean-reversion.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-eth-bollinger-rsi14-mean-reversion
  cancel-in-progress: false
jobs:
  frozen-mean-reversion:
    name: BB RSI14 causality tests and frozen multi-window replay
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile deterministic replay and tests
        run: python -m py_compile research/replay_btc_eth_bollinger_rsi14_mean_reversion.py tests/test_btc_eth_bollinger_rsi14_mean_reversion.py
      - name: Test BB RSI causality, entry/exit, risk sizing and hash gates
        run: python -m pytest -q tests/test_btc_eth_bollinger_rsi14_mean_reversion.py
      - name: Run frozen multi-window replay
        run: python research/replay_btc_eth_bollinger_rsi14_mean_reversion.py
      - name: Independently verify canonical input, gate count and evidence hashes
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("bollinger-rsi14-mean-reversion-2025-2026-output")
          result = json.loads((root / "result.json").read_text())
          gates = json.loads((root / "gate_results.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          data = json.loads((root / "dataset-evidence.json").read_text())
          expected = {
              "BTCUSDT": "a508cb02259c15ec67e6df8c1c8be406b1d5f64350cae17a33c463e728793d9d",
              "ETHUSDT": "d75f1b78f0c11ba889c81458801abf0d14758329819c55d6eda6efb0151a8510",
          }
          assert data["canonical_ohlcv_sha256"] == expected
          assert result["canonical_ohlcv_sha256"] == expected
          assert result["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert result["decision"] in {"PASS_HISTORICAL_SHADOW_ONLY", "FAIL_NO_TRADE"}
          assert len(result["scenario_results"]) == 18
          assert len(result["gates"]) == 5
          assert len(gates["gates"]) == 5
          assert gates["decision"] == result["decision"]
          assert gates["gate_summary"]["passed"] + gates["gate_summary"]["failed"] == 5
          assert manifest["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["decision"] == result["decision"]
          assert manifest["canonical_ohlcv_sha256"] == expected
          for name, meta in manifest["files"].items():
              payload = (root / name).read_bytes()
              assert len(payload) == meta["size_bytes"], f"size mismatch: {name}"
              assert hashlib.sha256(payload).hexdigest() == meta["sha256"], f"SHA-256 mismatch: {name}"
          assert len(data["data"]["BTCUSDT"]) == 4254
          assert len(data["data"]["ETHUSDT"]) == 4254
          print("CANONICAL OHLCV HASHES:", json.dumps(expected, sort_keys=True))
          print("INDICATOR SHA-256:", result["indicator_series_sha256"])
          print("SIGNAL SHA-256:", result["signal_series_sha256"])
          print("GATES:", json.dumps(gates["gate_summary"], sort_keys=True))
          print("DECISION:", result["decision"])
          PY
      - name: Run virtual backtest regression suite
        run: python -m pytest -q tests/test_virtual_backtest.py
      - name: Upload hash-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-eth-bollinger-rsi14-mean-reversion
          path: bollinger-rsi14-mean-reversion-2025-2026-output/
          if-no-files-found: warn
          retention-days: 90
