name: phase1.24.1-binance-websocket-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binance-websocket-e2e:
    name: real-binance-websocket-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, immutable SHA
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run real Binance Spot WebSocket E2E
        run: python scripts/phase1_24_1_binance_websocket_e2e.py
