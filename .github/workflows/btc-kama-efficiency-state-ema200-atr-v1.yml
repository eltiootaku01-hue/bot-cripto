name: BTC KAMA efficiency state EMA200 ATR14 frozen replay
on:
  push:
    branches:
      - research/btc-kama-efficiency-state-ema200-atr-v1
    paths:
      - research/kama_btc_efficiency_state_ema200_atr_v1.py
      - research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - tests/test_kama_btc_efficiency_state_ema200_atr_v1.py
      - .github/workflows/btc-kama-efficiency-state-ema200-atr-v1.yml
      - docs/research/BTC_KAMA_EFFICIENCY_STATE_EMA200_ATR_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-kama-efficiency-state-ema200-atr-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: KAMA efficiency tests and multi-regime replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile strategy and tests
        run: python -m py_compile research/kama_btc_efficiency_state_ema200_atr_v1.py research/replay_btc_momentum_90d_atr_full_2020_2026.py tests/test_kama_btc_efficiency_state_ema200_atr_v1.py
      - name: Run deterministic KAMA, ER, causal and ledger tests
        run: python -m pytest -q tests/test_kama_btc_efficiency_state_ema200_atr_v1.py
      - name: Acquire strict data and execute frozen replay
        run: python research/kama_btc_efficiency_state_ema200_atr_v1.py --output-dir kama-efficiency-atr-output
      - name: Upload full evidence even when gates fail
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-kama-efficiency-state-ema200-atr-v1
          path: kama-efficiency-atr-output/
          if-no-files-found: warn
          retention-days: 90
