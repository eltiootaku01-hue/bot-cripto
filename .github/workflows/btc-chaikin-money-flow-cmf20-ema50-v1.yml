name: BTC Chaikin Money Flow CMF20 EMA50 frozen replay
on:
  push:
    branches:
      - research/btc-chaikin-money-flow-cmf20-ema50-v1
    paths:
      - research/btc_volume_shock_reversal_v1.py
      - research/btc_chaikin_money_flow_cmf20_ema50_v1.py
      - research/test_btc_chaikin_money_flow_cmf20_ema50_v1.py
      - .github/workflows/btc-chaikin-money-flow-cmf20-ema50-v1.yml
      - docs/research/BTC_CHAIKIN_MONEY_FLOW_CMF20_EMA50_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-chaikin-money-flow-cmf20-ema50-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: Money-flow tests and preregistered multi-window replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Compile research code
        run: python -m py_compile research/btc_volume_shock_reversal_v1.py research/btc_chaikin_money_flow_cmf20_ema50_v1.py research/test_btc_chaikin_money_flow_cmf20_ema50_v1.py
      - name: Run deterministic signal and accounting tests
        run: python -m pytest -q research/test_btc_chaikin_money_flow_cmf20_ema50_v1.py
      - name: Acquire strict public dataset and replay frozen candidate
        run: python research/btc_chaikin_money_flow_cmf20_ema50_v1.py --output-dir btc-cmf20-ema50-output
      - name: Upload output including blocked evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-chaikin-money-flow-cmf20-ema50-v1
          path: btc-cmf20-ema50-output/
          if-no-files-found: warn
          retention-days: 90
