name: windows-handoff-smoke
on:
  pull_request:
    paths:
      - 'tools/windows-handoff/**'
      - '.github/workflows/windows-handoff-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Windows source download and extraction
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse Windows setup and prospective capture scripts without executing them
        shell: powershell
        run: |
          $scripts = @(
            @{ Path = '.\tools\windows-handoff\INSTALAR_BOTCRIPTO_PAPER.ps1'; Label = 'PAPER installer' },
            @{ Path = '.\tools\windows-handoff\INICIAR_CAPTURA_PROSPECTIVA.ps1'; Label = 'prospective capture launcher' }
          )
          foreach ($script in $scripts) {
            $source = (Resolve-Path $script.Path).Path
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "$($script.Label) contains PowerShell syntax errors."
            }
            Write-Host "$($script.Label) PowerShell syntax passed."
          }
          $runnerText = Get-Content -LiteralPath '.\tools\windows-handoff\INICIAR_CAPTURA_PROSPECTIVA.ps1' -Raw
          foreach ($requiredText in @('OPERATOR_DID_NOT_CONFIRM', 'prospective_capture_pair', 'prospective_capture_bundle', 'DISABLED_BY_PROJECT_POLICY')) {
            if ($runnerText -notmatch [regex]::Escape($requiredText)) {
              throw "Prospective capture launcher is missing safety or acceptance check: $requiredText"
            }
          }
          if ($runnerText -match '(?i)(api[_-]?secret|api[_-]?key|/api/v3/order|new_order)') {
            throw 'Prospective capture launcher must not reference private credentials or order submission.'
          }
      - name: Download and extract the pinned source on Windows
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'BOT-CRIPTO-LOCAL'
          & .\tools\windows-handoff\BAJAR_Y_EXTRAER_BOTCRIPTO.ps1 -Destination $destination
          $required = @(
            (Join-Path $destination 'pyproject.toml'),
            (Join-Path $destination 'cerebro\PROJECT_STATE.md'),
            (Join-Path $destination 'WINDOWS_LOCAL_HANDOFF_MANIFEST.txt'),
            (Join-Path $destination 'bot-cripto-source.zip')
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Required handoff output is missing: $item"
            }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $destination 'WINDOWS_LOCAL_HANDOFF_MANIFEST.txt') -Raw
          if ($manifest -notmatch 'Commit solicitado: 439d0b6cab598db683462ed891f05093b30d6575') {
            throw 'Manifest does not record the expected commit.'
          }
          Write-Host 'Windows handoff smoke test passed.'
