name: phase1.20-binance-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binance-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0, immutable SHA
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run real Binance E2E
        run: python scripts/phase1_20_binance_e2e.py
