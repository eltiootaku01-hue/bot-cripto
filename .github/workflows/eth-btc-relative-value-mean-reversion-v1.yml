name: ETH/BTC relative-value mean reversion V1 frozen paired replay
on:
  push:
    branches:
      - research/eth-btc-relative-value-zscore-v1
    paths:
      - research/btc_volume_shock_reversal_v1.py
      - research/eth_btc_relative_value_mean_reversion_v1.py
      - research/test_eth_btc_relative_value_mean_reversion_v1.py
      - .github/workflows/eth-btc-relative-value-mean-reversion-v1.yml
      - docs/research/ETH_BTC_RELATIVE_VALUE_MEAN_REVERSION_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eth-btc-relative-value-mean-reversion-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: Paired-data tests and preregistered multi-window replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Compile research code
        run: python -m py_compile research/btc_volume_shock_reversal_v1.py research/eth_btc_relative_value_mean_reversion_v1.py research/test_eth_btc_relative_value_mean_reversion_v1.py
      - name: Run deterministic signal and accounting tests
        run: python -m pytest -q research/test_eth_btc_relative_value_mean_reversion_v1.py
      - name: Acquire and validate paired public data; replay frozen candidate
        run: python research/eth_btc_relative_value_mean_reversion_v1.py --output-dir eth-btc-relative-value-output
      - name: Upload output including blocked evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eth-btc-relative-value-mean-reversion-v1
          path: eth-btc-relative-value-output/
          if-no-files-found: warn
          retention-days: 90
