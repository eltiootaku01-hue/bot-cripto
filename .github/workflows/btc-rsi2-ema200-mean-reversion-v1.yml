name: BTC RSI2 oversold EMA200 mean-reversion frozen replay
on:
  push:
    branches:
      - research/btc-rsi2-ema200-mean-reversion-v1
    paths:
      - research/rsi2_btc_ema200_mean_reversion_v1.py
      - research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - tests/test_rsi2_btc_ema200_mean_reversion_v1.py
      - .github/workflows/btc-rsi2-ema200-mean-reversion-v1.yml
      - docs/research/BTC_RSI2_EMA200_MEAN_REVERSION_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-rsi2-ema200-mean-reversion-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: RSI2 mean-reversion tests and full-regime replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile strategy and tests
        run: python -m py_compile research/rsi2_btc_ema200_mean_reversion_v1.py research/replay_btc_momentum_90d_atr_full_2020_2026.py tests/test_rsi2_btc_ema200_mean_reversion_v1.py
      - name: Run RSI, causality and accounting tests
        run: python -m pytest -q tests/test_rsi2_btc_ema200_mean_reversion_v1.py
      - name: Acquire strict market data and replay
        run: python research/rsi2_btc_ema200_mean_reversion_v1.py --output-dir rsi2-ema200-output
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-rsi2-ema200-mean-reversion-v1
          path: rsi2-ema200-output/
          if-no-files-found: warn
          retention-days: 90
