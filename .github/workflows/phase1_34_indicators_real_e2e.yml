name: phase1.34-indicators-real-e2e

on:
  push:
    branches:
      - phase1.34-indicators-real-e2e
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indicators-real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, immutable SHA
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run real Binance Spot REST to EMA and RSI E2E
        shell: bash
        run: |
          set +e
          python scripts/phase1_34_indicators_real_e2e.py
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "REAL E2E ENVIRONMENT BLOCKED"
          elif [ "$status" -ne 0 ]; then
            echo "REAL E2E IMPLEMENTATION FAILURE"
          fi
          exit "$status"
