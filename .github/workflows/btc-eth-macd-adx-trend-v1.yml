name: BTC ETH MACD ADX deterministic strategy replay
on:
  push:
    branches:
      - research/btc-eth-macd-adx-trend-v1
    paths:
      - "research/btc_eth_macd_adx_trend_v1.py"
      - "research/test_btc_eth_macd_adx_trend_v1.py"
      - ".github/workflows/btc-eth-macd-adx-trend-v1.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frozen-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact study revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test MACD, Wilder ADX, causal prefix, costs and accounting
        run: python -m pytest -q research/test_btc_eth_macd_adx_trend_v1.py
      - name: Download exact frozen BTC ETH candle artifact used by candidate #181
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: btc-eth-rotation-15pct-atr-sensitivity
          run-id: 40356916647
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Run the one preregistered no-AI method
        run: |
          set -euo pipefail
          mkdir -p evidence/btc-eth-macd-adx-trend-v1
          python -m research.btc_eth_macd_adx_trend_v1 \\
            --dataset input/dataset-evidence.json \\
            --output-dir evidence/btc-eth-macd-adx-trend-v1 \\
            --source-sha "$GITHUB_SHA"
      - name: Independently verify pinned inputs, gates, and every artifact hash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("evidence/btc-eth-macd-adx-trend-v1")
          result = json.loads((root / "result.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          assert result["status"] == "HISTORICAL_REPLAY_NOT_PROSPECTIVE_HOLDOUT"
          assert result["decision"] in {"PASS_HISTORICAL_SHADOW_ONLY", "FAIL_NO_TRADE"}
          assert result["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert result["canonical_ohlcv_hashes"] == {
              "BTCUSDT": "a508cb02259c15ec67e6df8c1c8be406b1d5f64350cae17a33c463e728793d9d",
              "ETHUSDT": "d75f1b78f0c11ba889c81458801abf0d14758329819c55d6eda6efb0151a8510",
          }
          assert result["bar_counts_4h"] == {"BTCUSDT": 4254, "ETHUSDT": 4254}
          assert result["source_record_hashes"] == {
              "BTCUSDT": "b5e3f7e490af598f44885c5b24983c16d6141a3d7c3cfe6f469ff95712eceb66",
              "ETHUSDT": "4fc086bbb600b4a51ee2881c5f54cc4121de583b83797e00207a2e63122dc392",
          }
          assert len(result["scenario_results"]) == 18
          assert len(result["benchmarks"]) == 42
          assert len(result["gates"]) == 26
          assert result["gate_summary"]["passed"] + result["gate_summary"]["failed"] == 26
          assert manifest["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["decision"] == result["decision"]
          for name, metadata in manifest["files"].items():
              payload = (root / name).read_bytes()
              assert len(payload) == metadata["size_bytes"], f"size mismatch: {name}"
              assert hashlib.sha256(payload).hexdigest() == metadata["sha256"], f"SHA-256 mismatch: {name}"
          print("CANONICAL OHLCV:", result["canonical_ohlcv_hashes"])
          print("CONFIG SHA-256:", result["strategy_configuration_sha256"])
          print("INDICATORS SHA-256:", result["indicators_and_signals_sha256"])
          print("GATES:", result["gate_summary"])
          print("DECISION:", result["decision"])
          PY
      - name: Upload full reproducible evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-eth-macd-adx-trend-v1-evidence
          path: evidence/btc-eth-macd-adx-trend-v1/
          if-no-files-found: error
          retention-days: 90
