name: BTC-ETH strategy research V1 replay

on:
  push:
    branches: [research/btc-eth-strategies-v1-main]
    paths:
      - "research/btc_eth_strategies_v1.py"
      - "research/requirements-btc-eth-strategies-v1.txt"
      - ".github/workflows/btc-eth-strategies-v1-replay.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay-verified-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
      - name: Install pinned research dependencies
        run: python -m pip install -r research/requirements-btc-eth-strategies-v1.txt
      - name: Download the exact annual paired-study artifact
        uses: actions/download-artifact@v7
        with:
          name: btc-eth-follow-365d-f8b9c36768f68ee754f1cb217f920dea25ef445e
          run-id: 39062915950
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Re-run seven predefined strategies on the hash-verified dataset
        run: |
          set -euo pipefail
          mkdir -p evidence
          python research/btc_eth_strategies_v1.py \
            --dataset input/btc-eth-follow-365d-dataset.json \
            --output evidence/btc-eth-strategies-v1-results.json \
            > evidence/btc-eth-strategies-v1-console.txt
      - name: Verify source hashes, temporal split, anti-lookahead and decision criteria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence/btc-eth-strategies-v1-results.json').read_text())
          assert result['dataset_sha256'] == '13d90afa798c94d56c18331e676089bc4594266c09d71bdab74146df1829f5a8'
          assert result['configuration_sha256'] == '2f6dc2e6021cd32fe5ff9b994f28d638d4f94ec2ce34b5c3873536e86ba0c50a'
          assert result['anti_lookahead']['status'] == 'PASS'
          assert result['anti_lookahead']['suffix_perturbations'] == 6
          assert result['anti_lookahead']['strategies_checked'] == 7
          assert result['split']['evaluation']['bars'] == 8760
          folds = result['split']['validation_folds']
          assert len(folds) == 3 and all(x['bars'] == 1440 for x in folds)
          assert folds[-1]['end_index_exclusive'] == result['split']['evaluation']['start_index']
          assert len(result['metrics']) == 120
          def metric(scope, cost, strategy):
              return next(x for x in result['metrics'] if x['scope'] == scope and x['cost'] == cost and x['strategy'] == strategy)
          momentum_base = metric('EVALUATION', 'BASE', 'ETH_TSMOM_168H')['return_pct']
          momentum_stress1 = metric('EVALUATION', 'STRESS_1', 'ETH_TSMOM_168H')['return_pct']
          momentum_stress2 = metric('EVALUATION', 'STRESS_2', 'ETH_TSMOM_168H')['return_pct']
          assert abs(momentum_base - 15.51381511110057) < 1e-7
          assert abs(momentum_stress1 - 1.9100444855739473) < 1e-7
          assert abs(momentum_stress2 - (-26.369480275531775)) < 1e-7
          assert metric('EVALUATION', 'BASE', 'CASH')['return_pct'] == 0
          assert metric('EVALUATION', 'BASE', 'BUY_HOLD_BTCUSDT')['return_pct'] < 0
          assert metric('EVALUATION', 'BASE', 'BUY_HOLD_ETHUSDT')['return_pct'] < 0
          assert not any(
              all(metric(f'VALIDATION_{i}', 'BASE', s)['return_pct'] > 0 for i in range(1, 4))
              and all(metric('EVALUATION', c, s)['return_pct'] > 0 for c in ('BASE', 'STRESS_1', 'STRESS_2'))
              for s in result['strategies']
          )
          print('DATASET SHA-256:', result['dataset_sha256'])
          print('CONFIGURATION SHA-256:', result['configuration_sha256'])
          print('VALIDATION folds:', len(folds), '× 1440 candles; evaluation:', result['split']['evaluation']['bars'])
          print('ANTI_LOOKAHEAD:', result['anti_lookahead'])
          print('ETH_TSMOM_168H evaluation returns:', momentum_base, momentum_stress1, momentum_stress2)
          print('DECISION: NO_ROBUST_EDGE_FOUND / NO_TRADE')
          PY
      - name: Upload replay output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-eth-strategies-v1-replay-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
