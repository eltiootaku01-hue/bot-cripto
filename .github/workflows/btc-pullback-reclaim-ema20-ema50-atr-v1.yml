name: BTC pullback EMA20 reclaim ATR14 frozen replay
on:
  push:
    branches:
      - research/btc-pullback-reclaim-ema20-ema50-atr-v1
    paths:
      - research/pullback_btc_ema20_reclaim_atr_v1.py
      - research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - tests/test_pullback_btc_ema20_reclaim_atr_v1.py
      - .github/workflows/btc-pullback-reclaim-ema20-ema50-atr-v1.yml
      - docs/research/BTC_PULLBACK_EMA20_RECLAIM_ATR_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-pullback-reclaim-ema20-ema50-atr-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: Pullback reclaim tests and multi-regime replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile frozen strategy and tests
        run: python -m py_compile research/pullback_btc_ema20_reclaim_atr_v1.py research/replay_btc_momentum_90d_atr_full_2020_2026.py tests/test_pullback_btc_ema20_reclaim_atr_v1.py
      - name: Run deterministic pullback, causality and ledger tests
        run: python -m pytest -q tests/test_pullback_btc_ema20_reclaim_atr_v1.py
      - name: Acquire strict data and execute frozen replay
        run: python research/pullback_btc_ema20_reclaim_atr_v1.py --output-dir pullback-reclaim-output
      - name: Upload evidence even if gates fail
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-pullback-reclaim-ema20-ema50-atr-v1
          path: pullback-reclaim-output/
          if-no-files-found: warn
          retention-days: 90
