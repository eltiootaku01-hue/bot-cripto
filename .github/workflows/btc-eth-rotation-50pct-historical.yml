name: BTC ETH relative-strength rotation — 50% allocation multi-regime replay

on:
  push:
    branches:
      - research/btc-eth-rotation-50pct-historical
    paths:
      - research/replay_btc_eth_relative_strength_50pct_historical.py
      - .github/workflows/btc-eth-rotation-50pct-historical.yml

permissions:
  contents: read

concurrency:
  group: btc-eth-rotation-50pct-historical
  cancel-in-progress: false

jobs:
  frozen-rotation-replay:
    name: Replay 50% BTC ETH rotation across fixed historical windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, immutable SHA
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile and run fixed multi-regime rotation replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rotation-50-output
          python -m py_compile research/replay_btc_eth_relative_strength_50pct_historical.py
          python research/replay_btc_eth_relative_strength_50pct_historical.py 2>&1 | tee rotation-50-output/console.txt
          python -m pytest -q tests/test_virtual_backtest.py
      - name: Upload hash-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, immutable SHA
        with:
          name: btc-eth-rotation-50pct-historical
          path: rotation-50-output/
          if-no-files-found: warn
          retention-days: 90
