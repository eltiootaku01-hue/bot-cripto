name: BTC momentum ATR14 full-regime robustness replay
on:
  push:
    branches:
      - research/btc-momentum-90d-atr-full-2020-2026
    paths:
      - research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - tests/test_btc_momentum_90d_atr_full_2020_2026.py
      - .github/workflows/btc-momentum-90d-atr-full-2020-2026.yml
      - docs/research/BTC_MOMENTUM_90D_ATR_FULL_2020_2026_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-momentum-90d-atr-full-2020-2026
  cancel-in-progress: false
jobs:
  full-regime-replay:
    name: Frozen strategy full-regime validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile candidate and tests
        run: python -m py_compile research/replay_btc_momentum_90d_atr_full_2020_2026.py tests/test_btc_momentum_90d_atr_full_2020_2026.py
      - name: Run targeted signal and risk-sizing tests
        run: python -m pytest -q tests/test_btc_momentum_90d_atr_full_2020_2026.py
      - name: Run full-regime data acquisition and frozen replay
        run: python research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - name: Upload output including blocked or failed-gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-momentum-90d-atr-full-2020-2026
          path: atr-risk-overlay-full-output/
          if-no-files-found: warn
          retention-days: 90
