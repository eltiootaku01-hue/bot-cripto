name: BTC SMA50/SMA200 annual robustness — 2023 to 2026

on:
  push:
    branches:
      - research/btc-daily-sma50-200-annual-robustness-2023-2026
    paths:
      - research/replay_btc_daily_sma50_200_annual_robustness_2023_2026.py
      - .github/workflows/btc-daily-sma50-200-annual-robustness-2023-2026.yml

permissions:
  contents: read

concurrency:
  group: btc-daily-sma50-200-annual-robustness-2023-2026
  cancel-in-progress: false

jobs:
  annual-robustness:
    name: Replay unchanged BTC SMA50/SMA200 rule by year
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, immutable SHA
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile, execute annual fixed-window replay, and run engine tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p annual-robustness-output
          python -m py_compile research/replay_btc_daily_sma50_200_annual_robustness_2023_2026.py
          python research/replay_btc_daily_sma50_200_annual_robustness_2023_2026.py 2>&1 | tee annual-robustness-output/console.txt
          python -m pytest -q tests/test_virtual_backtest.py
      - name: Upload hash-bound cross-year evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, immutable SHA
        with:
          name: btc-daily-sma50-200-annual-robustness-2023-2026
          path: annual-robustness-output/
          if-no-files-found: warn
          retention-days: 90
