name: Python dependency vulnerability audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit / installed project and test dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0, immutable SHA
        with:
          python-version: "3.12"
      - name: Install project, test dependencies, and pinned auditor
        run: python -m pip install -e ".[test]" "pip-audit==2.10.1"
      - name: Fail on known dependency vulnerabilities
        env:
          PIP_AUDIT_PROGRESS_SPINNER: "off"
        run: pip-audit
