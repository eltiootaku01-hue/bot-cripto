name: BTC ETH pullback continuation ATR V1 replay

on:
  push:
    branches:
      - research/btc-eth-pullback-continuation-atr-v1
    paths:
      - "research/btc_eth_pullback_atr_v1.py"
      - "research/test_btc_eth_pullback_atr_v1.py"
      - ".github/workflows/btc-eth-pullback-atr-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  frozen-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned research and test dependencies
        run: python -m pip install -e ".[test]" -r research/requirements-btc-eth-strategies-v1.txt
      - name: Test signal causality, daily regime alignment, costs, sizing and ledger
        run: python -m pytest -q research/test_btc_eth_pullback_atr_v1.py
      - name: Download immutable archived BTC ETH hourly source artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: btc-eth-follow-365d-f8b9c36768f68ee754f1cb217f920dea25ef445e
          run-id: 39062915950
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Execute the one frozen hypothesis under three cost models
        run: |
          set -euo pipefail
          mkdir -p evidence/btc-eth-pullback-atr-v1
          python research/btc_eth_pullback_atr_v1.py \
            --dataset input/btc-eth-follow-365d-dataset.json \
            --output-dir evidence/btc-eth-pullback-atr-v1 \
            --source-sha "$GITHUB_SHA"
      - name: Independently verify provenance and output hashes
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("evidence/btc-eth-pullback-atr-v1")
          result = json.loads((root / "result.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          assert result["status"] == "HISTORICAL_REPLAY_NOT_PROSPECTIVE_HOLDOUT"
          assert result["decision"] in {"PASS_HISTORICAL_SHADOW_ONLY", "FAIL_NO_TRADE"}
          assert result["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert result["source_raw_dataset_sha256"] == "3851a560aafbaa44f7d57081bd12f7dfdae070c2abff3d65e122ad8fcbd6df36"
          assert result["dataset_sha256"] == "13d90afa798c94d56c18331e676089bc4594266c09d71bdab74146df1829f5a8"
          assert result["dataset_configuration_sha256"] == "2f6dc2e6021cd32fe5ff9b994f28d638d4f94ec2ce34b5c3873536e86ba0c50a"
          assert len(result["scenario_results"]) == 18
          assert len(result["benchmarks"]) == 42
          assert len(result["gates"]) == 26
          assert result["gate_summary"]["passed"] + result["gate_summary"]["failed"] == 26
          assert manifest["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["decision"] == result["decision"]
          for name, meta in manifest["files"].items():
              payload = (root / name).read_bytes()
              assert len(payload) == meta["size_bytes"], f"size mismatch: {name}"
              assert hashlib.sha256(payload).hexdigest() == meta["sha256"], f"SHA-256 mismatch: {name}"
          print("DATASET SHA-256:", result["dataset_sha256"])
          print("CONFIGURATION SHA-256:", result["strategy_configuration_sha256"])
          print("INDICATORS/SIGNALS SHA-256:", result["indicators_and_signals_sha256"])
          print("STRESS_2 gates:", result["gate_summary"])
          print("DECISION:", result["decision"])
          PY
      - name: Upload raw result, metrics, fills, equity, report and hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-eth-pullback-atr-v1-evidence
          path: evidence/btc-eth-pullback-atr-v1/
          if-no-files-found: error
          retention-days: 90
