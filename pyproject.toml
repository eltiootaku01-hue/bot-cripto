[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-obrero"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["websocket-client==1.9.2"]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<9.2"]

[project.scripts]
bot-cripto = "bot_obrero.operator_cli:main"

[tool.setuptools.packages.find]
include = ["bot_obrero*"]
exclude = ["research*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
