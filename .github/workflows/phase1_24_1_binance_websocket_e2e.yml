name: phase1.24.1-binance-websocket-e2e

on:
  workflow_dispatch:

jobs:
  binance-websocket-e2e:
    name: real-binance-websocket-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run real Binance Spot WebSocket E2E
        run: python scripts/phase1_24_1_binance_websocket_e2e.py
