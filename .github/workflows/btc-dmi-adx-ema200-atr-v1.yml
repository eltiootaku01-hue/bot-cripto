name: BTC Wilder DMI ADX EMA200 ATR14 frozen replay
on:
  push:
    branches:
      - research/btc-dmi-adx-ema200-atr-v1
    paths:
      - research/dmi_btc_adx_ema200_atr_v1.py
      - research/replay_btc_momentum_90d_atr_full_2020_2026.py
      - tests/test_dmi_btc_adx_ema200_atr_v1.py
      - .github/workflows/btc-dmi-adx-ema200-atr-v1.yml
      - docs/research/BTC_DMI_ADX_EMA200_ATR_V1_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-dmi-adx-ema200-atr-v1
  cancel-in-progress: false
jobs:
  frozen-replay:
    name: Wilder DMI ADX tests and multi-regime replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Compile strategy and tests
        run: python -m py_compile research/dmi_btc_adx_ema200_atr_v1.py research/replay_btc_momentum_90d_atr_full_2020_2026.py tests/test_dmi_btc_adx_ema200_atr_v1.py
      - name: Run deterministic DMI, ADX, causality and ledger tests
        run: python -m pytest -q tests/test_dmi_btc_adx_ema200_atr_v1.py
      - name: Acquire strict data and run frozen DMI/ADX replay
        run: python research/dmi_btc_adx_ema200_atr_v1.py --output-dir dmi-adx-ema200-atr-output
      - name: Upload evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: btc-dmi-adx-ema200-atr-v1
          path: dmi-adx-ema200-atr-output/
          if-no-files-found: warn
          retention-days: 90
