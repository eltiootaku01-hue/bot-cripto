name: ETH 168h momentum + EMA100 — secondary YTD 2026 replay

on:
  push:
    branches:
      - research/eth-tsmom-168h-secondary-ytd-2026
    paths:
      - research/replay_eth_tsmom_168h_ema100_ytd_2026.py
      - .github/workflows/eth-tsmom-168h-secondary-ytd-2026.yml

permissions:
  contents: read

concurrency:
  group: eth-tsmom-168h-secondary-ytd-2026
  cancel-in-progress: false

jobs:
  secondary-replay:
    name: Frozen ETH 168h momentum replay Jan 1–Oct 21, 2026
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable SHA
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, immutable SHA
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile and execute fixed-parameter secondary replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secondary-output
          python -m py_compile research/replay_eth_tsmom_168h_ema100_ytd_2026.py
          python research/replay_eth_tsmom_168h_ema100_ytd_2026.py 2>&1 | tee secondary-output/console.txt
          python -m pytest -q tests/test_virtual_backtest.py
      - name: Upload hash-bound evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, immutable SHA
        with:
          name: eth-tsmom-168h-ema100-secondary-ytd-2026-${{ github.sha }}
          path: secondary-output/
          if-no-files-found: warn
          retention-days: 90
